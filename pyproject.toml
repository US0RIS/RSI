[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-rsi"
version = "0.1.0"
description = "Windows 11 desktop app that runs a recursive self-improvement loop on Qwen3.8 27B through Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
qwen-rsi-cli = "qwen_rsi.__main__:main"

[project.gui-scripts]
qwen-rsi = "qwen_rsi.__main__:gui_main"

[tool.setuptools.packages.find]
include = ["qwen_rsi*"]

[tool.setuptools.package-data]
"qwen_rsi" = ["seed_genome/*", "benchmark/*.json", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
